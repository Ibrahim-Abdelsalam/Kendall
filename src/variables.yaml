gpm_precip:
  id: gpm_precip
  name: Precipitation (GPM IMERG)
  student_definition: The total liquid and frozen water that falls from the atmosphere
    to Earth's surface during a month.
  units: mm/month
  dataset_short_name: GPM_3IMERGM
  version: '07'
  source_variable: precipitation
  source_group: Grid
  file_format: HDF5
  time_range: !!python/tuple
  - '2000-06-01'
  - '2025-09-01'
  aggregation: hours_per_month_integral
  native_resolution: 0.1 degree (1800 x 3600)
  is_flux_rate: true
  scale_factor: 1.0
  add_offset: 0.0
gldas_precip:
  id: gldas_precip
  name: Precipitation (GLDAS Reanalysis)
  student_definition: Monthly rainfall and snowfall arriving at land surface modeled
    by atmospheric reanalysis (independent check).
  units: mm/month
  dataset_short_name: GLDAS_NOAH025_M
  version: '2.1'
  source_variable: Rainf_f_tavg
  source_group: null
  file_format: nc4
  time_range: !!python/tuple
  - '2000-06-01'
  - '2025-09-01'
  aggregation: kg_m2_s_to_mm_month
  native_resolution: 0.25 degree (600 x 1440)
  is_flux_rate: true
  scale_factor: 1.0
  add_offset: 0.0
gldas_soil_moist:
  id: gldas_soil_moist
  name: Top-Layer Soil Moisture (0-10cm)
  student_definition: The amount of liquid water stored in the upper 10 cm of the
    soil column available to plant root systems.
  units: kg/m^2
  dataset_short_name: GLDAS_NOAH025_M
  version: '2.1'
  source_variable: SoilMoi0_10cm_inst
  source_group: null
  file_format: nc4
  time_range: !!python/tuple
  - '2000-06-01'
  - '2025-09-01'
  aggregation: monthly_mean
  native_resolution: 0.25 degree (600 x 1440)
  is_flux_rate: false
  scale_factor: 1.0
  add_offset: 0.0
gldas_temp:
  id: gldas_temp
  name: 2m Air Temperature
  student_definition: The temperature of ambient air measured 2 meters above the ground
    surface.
  units: degC
  dataset_short_name: GLDAS_NOAH025_M
  version: '2.1'
  source_variable: Tair_f_inst
  source_group: null
  file_format: nc4
  time_range: !!python/tuple
  - '2000-06-01'
  - '2025-09-01'
  aggregation: kelvin_to_celsius
  native_resolution: 0.25 degree (600 x 1440)
  is_flux_rate: false
  scale_factor: 1.0
  add_offset: -273.15
gldas_evap:
  id: gldas_evap
  name: Total Evapotranspiration
  student_definition: The combined transfer of water to the atmosphere through evaporation
    from soil and transpiration from plants.
  units: mm/month
  dataset_short_name: GLDAS_NOAH025_M
  version: '2.1'
  source_variable: Evap_tavg
  source_group: null
  file_format: nc4
  time_range: !!python/tuple
  - '2000-06-01'
  - '2025-09-01'
  aggregation: kg_m2_s_to_mm_month
  native_resolution: 0.25 degree (600 x 1440)
  is_flux_rate: true
  scale_factor: 1.0
  add_offset: 0.0
merra2_aod:
  id: merra2_aod
  name: Aerosol Optical Depth (550nm)
  student_definition: A dimensionless index of sunlight extinction by airborne atmospheric
