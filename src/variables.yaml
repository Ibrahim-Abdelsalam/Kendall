modis_ndvi:
  id: modis_ndvi
  name: Vegetation Greenness (NDVI)
  included_in_submission: false
  status: not included in this submission
  student_definition: A satellite vegetation index indicating photosynthetic activity
    and canopy greenness ranging from -0.2 to 1.0.
  units: '1'
  dataset_short_name: MOD13C2
  version: '061'
  source_variable: _0_05_Deg_Monthly_NDVI
  source_group: null
  file_format: HDF4
  time_range: !!python/tuple
  - '2000-06-01'
  - '2025-09-01'
  aggregation: scale_factor
  native_resolution: 0.05 degree (3600 x 7200)
  is_flux_rate: false
  scale_factor: 0.0001
  add_offset: 0.0
